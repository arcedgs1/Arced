services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: arced
      POSTGRES_USER: arced
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a database password}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U arced]
      interval: 5s
      timeout: 3s
      retries: 20
  app:
    build: .
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      DATABASE_URL: postgres://arced:${POSTGRES_PASSWORD}@db:5432/arced
      SESSION_SECRET: ${SESSION_SECRET:?Set a random session secret}
      SEED_EMAIL: ${SEED_EMAIL:-owner@example.test}
      SEED_PASSWORD: ${SEED_PASSWORD:-}
      NODE_ENV: development
      UPLOAD_DIR: /private-files
    volumes:
      - private_files:/private-files
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "npm run migrate && npm run dev"
volumes:
  database:
  private_files:
